# Phase 1 pipeline check. Twenty optimizer updates on one neutral sentence.
# This file does not configure the later teaching-form comparison.

model: mlx-community/Qwen3-4B-Instruct-2507-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: data/fixtures/phase1
seed: 0
num_layers: 16
batch_size: 1
iters: 20
learning_rate: 1.0e-5
steps_per_report: 1
steps_per_eval: 1000
grad_accumulation_steps: 1
val_batches: 0
adapter_path: outputs/phase1/adapter
save_every: 20
test: false
max_seq_length: 1024
grad_checkpoint: false
mask_prompt: false

# Official mlx-lm example settings, kept small for a smoke test.
lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
  rank: 8
  scale: 20.0
  dropout: 0.0
